<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NOI竞赛知识点</title>
    <script src="https://unpkg.com/@antv/g6@5/dist/g6.min.js"></script>
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
    <div class="container">
        <h1>NOI竞赛知识点体系</h1>
        
        <div class="skill-table-container">
            <table id="skill-table" class="skill-table">
                <thead>
                    <tr>
                        <th class="corner-cell"></th>
                        <th>计算机基础与编程环境</th>
                        <th>C++程序设计</th>
                        <th>数据结构</th>
                        <th>算法</th>
                        <th>数学</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th>入门级</th>
                        <td id="basic-env" class="skill-cell"></td>
                        <td id="basic-cpp" class="skill-cell"></td>
                        <td id="basic-ds" class="skill-cell"></td>
                        <td id="basic-algo" class="skill-cell"></td>
                        <td id="basic-math" class="skill-cell"></td>
                    </tr>
                    <tr>
                        <th>提高级</th>
                        <td id="intermediate-env" class="skill-cell"></td>
                        <td id="intermediate-cpp" class="skill-cell"></td>
                        <td id="intermediate-ds" class="skill-cell"></td>
                        <td id="intermediate-algo" class="skill-cell"></td>
                        <td id="intermediate-math" class="skill-cell"></td>
                    </tr>
                    <tr>
                        <th>NOI级</th>
                        <td id="noi-env" class="skill-cell"></td>
                        <td id="noi-cpp" class="skill-cell"></td>
                        <td id="noi-ds" class="skill-cell"></td>
                        <td id="noi-algo" class="skill-cell"></td>
                        <td id="noi-math" class="skill-cell"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div id="detail-panel" class="detail-panel">
            <h3>知识点详情</h3>
            <div id="detail-content"></div>
        </div>
        
        <div id="dependency-graph" class="dependency-graph"></div>
    </div>

    <script src="./src/data.js"></script>
    <script src="./src/index.js"></script>
</body>
</html>
