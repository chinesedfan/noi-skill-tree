<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NOI竞赛知识点</title>
    <script src="https://gw.alipayobjects.com/os/lib/antv/g6/4.8.19/dist/g6.min.js"></script>
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
    <div class="container">
        <h1>NOI竞赛知识点体系</h1>
        
        <div id="skill-tree-container" class="skill-tree-container">
            <!-- The skill tree will be rendered here by G6 -->
        </div>
        
        <div id="detail-panel" class="detail-panel">
            <div class="detail-header">
                <h3>知识点详情</h3>
                <button id="close-detail" class="close-button">×</button>
            </div>
            <div id="detail-content"></div>
        </div>
        
        <!-- Drawer for group node children -->
        <div id="drawer-panel" class="drawer-panel">
            <div class="drawer-header">
                <h3 id="drawer-title">知识点分组</h3>
                <button id="close-drawer" class="close-button">×</button>
            </div>
            <div id="drawer-content" class="drawer-content">
                <ul id="drawer-list" class="drawer-list"></ul>
            </div>
        </div>
        
        <div class="legend">
            <div class="legend-title">难度级别</div>
            <div class="legend-items">
                <div class="legend-item">
                    <span class="legend-color level-1"></span>
                    <span class="legend-label">1级</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color level-3"></span>
                    <span class="legend-label">3级</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color level-5"></span>
                    <span class="legend-label">5级</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color level-7"></span>
                    <span class="legend-label">7级</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color level-10"></span>
                    <span class="legend-label">10级</span>
                </div>
            </div>
        </div>
    </div>

    <script src="./src/data.js"></script>
    <script src="./src/index.js"></script>
</body>
</html>
